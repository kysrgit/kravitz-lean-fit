<!--
  Dosya: assets/noise.svg
  Açıklama: ARENA sahnesi üzerinde %4-6 opaklıkta kullanılan tekrar edebilir SVG film greni (noise) dokusu.
-->
<svg xmlns="http://www.w3.org/2000/svg" width="180" height="180" viewBox="0 0 180 180">
  <filter id="arena-film-grain" x="0" y="0" width="100%" height="100%">
    <feTurbulence
      type="fractalNoise"
      baseFrequency="0.85"
      numOctaves="3"
      stitchTiles="stitch"
      seed="17"
    />
    <feColorMatrix type="saturate" values="0" />
  </filter>
  <rect width="180" height="180" filter="url(#arena-film-grain)" opacity="0.9" />
</svg>
